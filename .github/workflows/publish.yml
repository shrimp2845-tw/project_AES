name: Publish Python Package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine requests

      - name: Build package
        run: python -m build

      - name: Check version exists on PyPI
        id: check
        run: |
          PACKAGE=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          VERSION=${GITHUB_REF_NAME#v}

          URL="https://pypi.org/pypi/${PACKAGE}/${VERSION}/json"

          echo "Checking $URL"

          if curl --silent --fail $URL > /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if version exists
        if: steps.check.outputs.exists == 'true'
        run: echo "Version already exists"

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*